replicaCount: 2

image:
  repository: heart-disease-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  LOG_LEVEL: INFO
  PORT: "8000"
  WORKERS: "1"

service:
  type: LoadBalancer
  port: 8080
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: heart-api.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

metrics:
  scrape: true
  path: /metrics

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""

nodeSelector: {}
tolerations: []
affinity: {}
