groups:
  - name: heart-disease-api
    rules:
      - alert: HeartApiDown
        expr: up{job="heart-disease-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Heart disease API target {{ $labels.instance }} is down"

      - alert: HeartApiModelNotLoaded
        expr: max(heart_api_model_loaded) < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Model is not loaded - /predict returns 503"

      - alert: HeartApiHighServerErrorRate
        expr: |
          sum(rate(heart_api_requests_total{status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(heart_api_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests fail with 5xx"

      - alert: HeartApiSlowPredictions
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(heart_api_request_duration_seconds_bucket{endpoint="/predict"}[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 /predict latency above 500 ms"

      - alert: HeartApiPredictionDrift
        expr: |
          (sum(rate(heart_api_prediction_probability_sum[30m])) / clamp_min(sum(rate(heart_api_prediction_probability_count[30m])), 1e-9))
            > 0.75
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Mean predicted disease probability unusually high (possible input drift)"
