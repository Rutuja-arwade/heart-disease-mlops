# Prometheus config for Kubernetes: discovers API pods via annotations
#   prometheus.io/scrape: "true", prometheus.io/port, prometheus.io/path
global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    environment: kubernetes

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: heart-disease-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [heart-disease]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
        target_label: version

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
