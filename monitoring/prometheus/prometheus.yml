# Prometheus config for the local docker-compose stack (static target).
global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    environment: local-compose

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: heart-disease-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: heart-disease-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
