[project]
name = "heart-disease-mlops"
version = "1.0.0"
description = "End-to-end MLOps pipeline for UCI heart disease risk prediction"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", ".venv", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/eda.py"]
